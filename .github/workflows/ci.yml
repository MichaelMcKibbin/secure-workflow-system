name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit Tests
        run: dotnet test secure-workflow-system.Tests.Unit/secure-workflow-system.Tests.Unit.csproj --no-build --verbosity normal --logger "console;verbosity=detailed"

      - name: Component Tests
        run: dotnet test secure-workflow-system.Tests.Components/secure-workflow-system.Tests.Components.csproj --no-build --verbosity normal --logger "console;verbosity=detailed"

      - name: Test Coverage
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger trx

      - name: Format Check
        run: dotnet format --verify-no-changes secure-workflow-system.slnx

      - name: Docker Build Check
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false