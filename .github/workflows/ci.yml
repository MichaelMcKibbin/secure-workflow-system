name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore

      - name: Build solution
        run: dotnet build secure-workflow-system.slnx --configuration Release --no-restore

      - name: Format Check
        run: dotnet format --verify-no-changes secure-workflow-system.slnx

      - name: Docker Build Check
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
