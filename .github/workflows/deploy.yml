name: Build and Deploy Workflow App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build_image.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --configuration Release

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: MichaelMcKibbin
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/michaelmckibbin/secure-workflow-system:sha-${{ github.sha }}

      - name: Upload docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /docker/workflow/

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /docker/workflow
            echo "IMAGE_DIGEST=${{ needs.build-and-push.outputs.image_digest }}" > workflow.env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> workflow.env
            echo "ConnectionStrings__DefaultConnection=${{ secrets.WORKFLOW_CONNECTION_STRING }}" >> workflow.env
            echo "SEED_ADMIN_EMAIL=${{ secrets.SEED_ADMIN_EMAIL }}" >> workflow.env
            echo "SEED_ADMIN_PASSWORD=${{ secrets.SEED_ADMIN_PASSWORD }}" >> workflow.env
            echo "SEED_USER_EMAIL=${{ secrets.SEED_USER_EMAIL }}" >> workflow.env
            echo "SEED_USER_PASSWORD=${{ secrets.SEED_USER_PASSWORD }}" >> workflow.env
            echo "SEED_STAFF_EMAIL=${{ secrets.SEED_STAFF_EMAIL }}" >> workflow.env
            echo "SEED_STAFF_PASSWORD=${{ secrets.SEED_STAFF_PASSWORD }}" >> workflow.env
            echo "DataProtection__KeyRingPath=/var/lib/workflow/dpkeys" >> workflow.env

            docker compose -p workflow --env-file workflow.env pull
            docker compose -p workflow --env-file workflow.env up -d --force-recreate
            docker compose -p workflow --env-file workflow.env ps

            sleep 10
            curl -f https://workflow.michaelmckibbin.cloud/health
